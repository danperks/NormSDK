[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "normsdk"
version = "0.1.0"
description = "Norm Two smartwatch protocol (UniFFI bindings to the NormSDK Rust core)"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }

[project.optional-dependencies]
ble = ["bleak>=0.22"]

[tool.setuptools]
packages = ["normsdk"]

[tool.setuptools.package-data]
normsdk = ["*.dylib", "*.so", "*.dll"]
